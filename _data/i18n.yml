# Vietnamese translations for strings that come from data files.
#
# The site is English by default; the nav button switches to Vietnamese.
# Page prose is translated inline in each page (see _includes/t.html).
# This file covers values read from _data/*.yml: it maps the exact English
# string to its Vietnamese rendering, via _includes/term.html. A string with
# no entry here is shown unchanged in both languages, so new data never breaks.
# Publication titles, abstracts, venues and tags are deliberately left in English.

terms:
  # Publication links
  "Paper": "Bài báo"
  "Code": "Mã nguồn"
  "Supplement": "Phụ lục"
  "Artifact": "Artifact"
  "Poster": "Poster"
  "Dataset": "Bộ dữ liệu"
  "Slides": "Slide"
  "Tool": "Công cụ"
  "Thesis": "Luận văn"

  # Publication status and awards
  "To appear": "Sắp xuất bản"
  "Won Outstanding Student Paper Award": "Đạt giải Bài báo sinh viên xuất sắc"
  "Nominated for Best Paper Award": "Được đề cử giải Bài báo xuất sắc nhất"
  "Won Best Paper Award": "Đạt giải Bài báo xuất sắc nhất"

